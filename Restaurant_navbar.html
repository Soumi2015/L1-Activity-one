<!DOCTYPE html>
<html>

<head>
    <title>Restaurant Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: cursive;
        }

        .topnav {
            overflow: hidden;
            background-color: black;
        }


        .topnav a {
            float: left;
            color: crimson;
            text-align: center;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 18px;
        }

        .topnav a:hover {
            background-color: beige;
            color: darkred;
        }

        .topnav a.active {
            background-color: burlywood;
            color: chocolate;
        }
    </style>

    <h1>THE AURORA DINING </h1>
    <img src="Magical world of flavours.png" alt="List of books" width="400">
</head>

<body>

    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">About_Us</a>
        <a href="#">Breakfast</a>
        <a href="#">Lunch(Main Course)</a>
        <a href="#">Starter</a>
        <a href="#">Snacks</a>
        <a href="#">Juices/Beverages</a>
        <a href="#">Table_Reserve</a>
        <a href="#">Decoration for a Special Day</a>
        <a href="#">Rate_Us</a>

    </div>
</body>

</html>
