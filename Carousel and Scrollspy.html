<DOCTYPE html>
    <html>

    <head>

        <title> Scrollspy + Carousel (No jQuery)</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <style>
            body {

                position: relative;

            }

            p {

                font-size: 18px;

            }

            #carouselSection {

                padding-top: 70px;

                background: #f8f9fa;

            }

            #section1 {

                padding-top: 70px;

                height: 500px;

                color: white;

                background-color: orange;

            }

            #section2 {

                padding-top: 70px;

                height: 500px;

                color: green;

                background-color: white;

            }

            .carousel-item img {

                width: 100%;

                height: 400px;

                object-fit: cover;

            }
        </style>

    </head>

    <body data-bs-spy="scroll" data-bs-target="navbar" data-bs-offset="50">

        <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">Codingal</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collaps navbar-collapse" id="myNavbar"></div>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#carouselSection">Carousel</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#section1">Section 1</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="#section2">Section 2</a>
                    </li>
                </ul>
            </div>

            </div>

        </nav>

        <div id="carouselSection" class="container">

            <h2>Carousel Example</h2>

            <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

                <div class="carousel-indicators">

                    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>


                    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>


                    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
                </div>


                <div class="carousel-inner">

                    <div class="carousel-item active">

                        <img src="Harry potter jpeg.jpg" alt="Harry Potter">

                    </div>

                    <div class="carousel-item">

                        <img src="Hermione Granger jpeg.jpg" alt="Hermione Granger">

                    </div>

                    <div class="carousel-item">

                        <img src="Ronald Weasley jpeg.jpg" alt="Ronald Weasley">

                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">

                    <span class="carousel-control-prev-icon"></span>

                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">

                    <span class="carousel-control-next-icon"></span>

                </button>
            </div>
        </div>

        <div id="section1" class="container-fluid">

            <h1>Section 1</h1>

            <h3>Codingal</h3>

            <p>Scroll this section.</p>

        </div>

        <!-- Section 2 -->

        <div id="section2" class="container-fluid">

            <h1>Section 2</h1>

            <h3>Codingal</h3>

            <p>Scroll this section.</p>

        </div>

        <script>

            new bootstrap.ScrollSpy(document.body, {

                target: '#navbar',

                offset: 50

            });

        </script>





    </body>

    </html>
