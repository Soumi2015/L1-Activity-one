<!DOCTYPE html>
<html>

<head>
    <title>Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            overflow: hidden;
            background-color: rgb(24, 26, 25);
        }

        .topnav a {
            float: left;
            color: rgb(212, 64, 138);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 18px;
        }

        .topnav a:hover {
            background-color: lightyellow;
            color: indianred;
        }

        .topnav a.active {
            background-color: lavenderblush;
            color: blueviolet;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">About_Us</a>
        <a href="#">Gallery</a>
        <a href="#">Contact_Us</a>
    </div>
</body>

</html>
