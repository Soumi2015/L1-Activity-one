<!DOCTYPE html>
<html>

<head>

    <style>
        .example1 {
            width: 300px;
            background-color: darksalmon;
            padding: 50px;
            border: 5px solid #800080;
            margin-top: 60px;
            margin-right: 60px;
            color: rgb(243, 11, 11);
            font-family: cursive;
            box-shadow: 10px 10px 10px 10px black;

        .example2 {
            width: 300px;
            background-color: rgb(155, 83, 236);

            color: white;
            font-family: Arial, Helvetica, sans-serif;
            box-shadow: 10px 10px 10px 10px black;
            font-size: 30px;
            font-weight: bolder;
        }
    </style>


</head>

<body>

    <h1> Example Of Box Model</h1>

    <p class="example1">Heading</p>

    <p class="example2">Content</p>

</html>
