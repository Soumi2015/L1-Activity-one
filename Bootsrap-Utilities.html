<DOCTYPE>
    <html>

    <head>
        <title>Bootstrap Utilities Example</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>

    <body>

        <div class="jumbotron jumbotron fluid text-center bg-light">
            <div class="container">
                <h1 class="text-warning">Codingal</h1>
                <p>Codingal will help you fall in love with coding.</p>
            </div>
        </div>


        <div class="container mt-4 text-center">

            <h2>Buttons</h2>

            <button type="button" class="btn btn-primary m-1">Primary</button>

            <button type="button" class="btn btn-secondary m-1">Secondary</button>

            <button type="button" class="btn btn-success m-1">Success</button>

            <button type="button" class="btn btn-warning m-1">Warning</button>

            <button type="button" class="btn btn-danger m-1">Danger</button>
        </div>

        <div class="container mt-5 text-center">

            <h2>Badges</h2>

            <span class="badge badge-primary p-2">Primary</span>

            <span class="badge badge-secondary p-2">Secondary</span>

            <span class="badge badge-success p-2">Success</span>

            <span class="badge badge-danger p-2">Danger</span>

            <span class="badge badge-warning p-2">Warning</span>

            <span class="badge badge-info p-2">Info</span>

            <span class="badge badge-dark p-2">Dark</span>
        </div>

        <div class="container mt-5">

            <h2 class="text-center">Progress Bar</h2>

            <div class="progress">

                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:90%">
                    90%
                </div>
            </div>
        </div>

    </body>

    </html>
