<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            font-family: cursive;
        }

        .content {
            min-height: 80vh;
            padding: 20px;
        }

        .site-footer {
            background-color: #1e1e1e;
            color: mintcream;
            padding: 40px 20px 10px;

        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            max-width: 1100px;
            margin: auto;
        }

        .footer-section {
            flex: 1;
            min-width: 220px;
            margin: 10px;
        }

        .footer-section h3 {
            color: yellow;
            margin-bottom: 15px;
        }

        .footer-section ul {
            list-style: none;
            padding: 0;
        }

        .footer-section ul li {
            margin: 8px 0;
        }

        .footer-section ul li a {
            color: whitesmoke;
            text-decoration: none;
        }

        .footer-section ul li a:hover {
            color: yellow;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 10px;
            color: #fa7979;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>


    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This is the main content of the webpage.</p>
    </div>

    <footer class="site-footer">
        <div class="footer-container">

            <div class="footer-section">
                <h3>About Us</h3>
                <p>We createsimple and modern websites for learning and business.</p>
            </div>

            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">contact</a></li>
                </ul>
            </div>

            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>Email: info@example.com</p>
                <p>Phone: +65 6784520171</p>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 My Website. All Rights Reserved.</p>
        </div>
    </footer>
</body>

</html>
